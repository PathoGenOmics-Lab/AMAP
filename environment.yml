# AMAP Conda Environment
# For reproducible execution outside Docker/Singularity.
#
# Install: conda env create -f environment.yml
# Activate: conda activate amap
#
# Pinned versions match Docker image paururo/amap:latest
name: amap
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core annotation tools
  - bakta=1.12.0
  - miniprot=0.18
  - diamond=2.1.24
  - eggnog-mapper=2.1.12
  - pangene=1.1
  - pathotypr=1.0.0
  # Runtime
  - python=3.9
  - r-base=4.4
  # Python libraries
  - pandas>=2.0
  - biopython>=1.80
  - matplotlib>=3.7
  - numpy>=1.24
  - networkx>=3.0
  - pip
  - pip:
    - intervaltree>=3.1
    - python-louvain>=0.16
    - pyvis>=0.3
  # R packages (for report)
  - r-rmarkdown
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-ggpubr
  - r-dt
  - r-stringr
  - r-knitr
  - r-rstatix
  - r-ggrepel
  - r-scales
  - r-pheatmap
  - r-plotly
  - r-rcolorbrewer

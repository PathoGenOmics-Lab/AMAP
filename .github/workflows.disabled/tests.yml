name: Tests

on:
  push:
    branches: [main, fix, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy biopython intervaltree
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
      
      - name: Syntax check all Python scripts
        run: |
          python -m py_compile bin/classify_cases.py
          python -m py_compile bin/validate_inputs.py
          python -m py_compile bin/export_clean_proteome.py
          python -m py_compile bin/annotation_qc.py
          python -m py_compile bin/generate_tsv_gff_gbk.py
          python -m py_compile bin/merge_rtabs.py
          python -m py_compile bin/count_annot.py
          python -m py_compile bin/check_cds.py
          python -m py_compile bin/network_genomes.py
          python -m py_compile bin/rename_fastas.py
          python -m py_compile bin/to_panaroo.py
          echo "All Python files compile successfully"

name: Documentation

# The website is plain HTML in docs/, which GitHub Pages serves as it is from
# main (Settings, Pages, Deploy from a branch: main, /docs; docs/.nojekyll keeps
# Jekyll out of it), so there is nothing to build or deploy here. This checks that the pages written from the markdown
# are current, and that every drawing, threshold, option and station on them
# still matches the pipeline: a change to bin/ or main.nf that would make the
# site wrong fails here as well.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/**"
      - "bin/**"
      - "modules/**"
      - "main.nf"
      - "nextflow.config"
      - "README.md"
      - "CHANGELOG.md"
      - "requirements-test.txt"
      - "docker/Dockerfile"
      - "tests/benchmark/README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - "bin/**"
      - "modules/**"
      - "main.nf"
      - "nextflow.config"
      - "README.md"
      - "CHANGELOG.md"
      - "requirements-test.txt"
      - "docker/Dockerfile"
      - "tests/benchmark/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # The drawings are checked by running bin/ on them, so the same
      # libraries the tests use.
      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: The pages match their markdown
        run: python3 tools/build_docs.py --check

      - name: The website matches the pipeline
        run: python3 tools/check_site.py
